const has=(a,q,k)=>(a[q]||[]).includes(k);
/* Měsíční cena bez DPH při měsíční platbě, stav podkladů k 2. 11. 2026. */
function cost(p,a){
  const n=a.products, s=k=>has(a,'sales',k), o=k=>has(a,'ops',k), world=a.ship==='world';
  if(p==='S'){
    const addons=s('rating')||s('coupon')||o('stock')||s('cart')||a.variants==='many';
    if(s('loyal')||n>1000) { const e=n>5000||world; return {tier:e?'Enterprise':'Profi',m:e?4690:2490,vat:1,n:s('loyal')&&!e?'Věrnostní slevy jsou až v tarifu Profi.':''}; }
    if(world) return {tier:'Enterprise',m:4690,vat:1,n:'Cizí měny a jazyky jsou v Shoptetu až v Enterprise, nebo doplněk cizí měny za 300 Kč.'};
    if(n<=10&&!addons&&!o('acc')) return {tier:'Free',m:0,vat:0,n:'Limit je 10 produktů, méně funkcí a vyšší poplatek z plateb.'};
    if(n<=100){ let m=440,x=[]; if(s('rating')){m+=100;x.push('hodnocení 100 Kč')} if(s('coupon')){m+=200;x.push('kupóny 200 Kč')} if(o('stock')){m+=200;x.push('sklad 200 Kč')}
      if(m>=1490) return {tier:'Business',m:1490+(s('coupon')?200:0),vat:1,n:'S více doplňky už vychází lépe vyšší tarif.'};
      return {tier:'Basic',m,vat:1,n:x.length?'Cena zahrnuje doplňky: '+x.join(', ')+'.':''}; }
    return {tier:'Business',m:1490+(s('coupon')?200:0),vat:1,n:s('coupon')?'Včetně kupónů za 200 Kč.':''};
  }
  if(p==='R'){
    const biz=s('rating')||s('cart'), st=s('coupon')||s('loyal')||s('blog')||o('acc');
    if(n>1000||biz) return {tier:'Business',m:1190,vat:1,n:biz?'Hodnocení a opuštěný košík jsou až tady. Limity vyšších tarifů si ověř v ceníku.':'Limity vyšších tarifů si ověř v ceníku.'};
    if(n>100||st) return {tier:'Startup',m:590,vat:1,n:'Limity tarifu si ověř v ceníku.'};
    return {tier:'Hobby',m:390,vat:1,n:'Na 2 roky předem vychází na 312 Kč měsíčně.'};
  }
  if(p==='U'){
    if(n>5000) return {tier:'Platinum',m:3250,vat:1};
    if(n>1000) return {tier:'Gold',m:1750,vat:1};
    if(n>100||world) return {tier:'Silver',m:1150,vat:1,n:world?'Silver má 2 jazyky, Gold 5.':''};
    return {tier:'Bronze',m:450,vat:1,n:'Všechny funkce jsou v každém tarifu, tarify se liší počtem produktů a jazyků.'};
  }
  if(p==='F'){
    if(n>3000) return {tier:'Plus',m:2700,vat:1};
    if(n>500) return {tier:'Basic',m:1530,vat:1};
    if(n>50) return {tier:'Start',m:825+(world?400:0),vat:1,n:world?'Včetně více jazyků za 400 Kč.':''};
    return {tier:'Mini',m:470+(world?400:0),vat:1,n:world?'Včetně více jazyků za 400 Kč.':'Limit je 50 produktů.'};
  }
  if(p==='N'){
    if(o('acc')||world) return {tier:'Business',m:999,vat:1,n:'Automatická fakturace a cizí měny jsou až v tomhle balíčku. Doména je první rok zdarma jen při roční platbě, jinak stojí 499 Kč ročně bez DPH. Převod domény koupené jinde je zdarma, platíš jen její prodloužení.'};
    const pro=a.variants!=='no'||s('coupon')||o('heureka')||a.ship==='sk';
    return pro?{tier:'Profi',m:779,vat:1,n:'Varianty, slevy, export do srovnávačů a doprava do zahraničí jsou až od tohoto balíčku. Při roční platbě akčně 379 Kč měsíčně bez DPH. Doména je první rok zdarma jen při roční platbě, jinak stojí 499 Kč ročně bez DPH. Převod domény koupené jinde je zdarma, platíš jen její prodloužení.'}:{tier:'Standard',m:479,vat:1,n:'Bez variant, slev, exportu do srovnávačů a dopravy do zahraničí. Při roční platbě akčně 209 Kč měsíčně bez DPH. Doména je první rok zdarma jen při roční platbě, jinak stojí 499 Kč ročně bez DPH. Převod domény koupené jinde je zdarma, platíš jen její prodloužení.'};
  }

function score(a){
